[package]
name = "guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
profiling = []

[[bin]]
name = "guest"
path = "src/main.rs"

[lib]
doctest = false

[dependencies]
contract-core = { path = "../../contract-core" }
risc0-zkvm = { workspace = true, default-features = false, features = ["heap-embedded-alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
hex = "0.4"
proptest = "1.6"
serde_json = "1.0"
