[package]
name = "guest-minimal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "guest-minimal"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { workspace = true, features = ["heap-embedded-alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
