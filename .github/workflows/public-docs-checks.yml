name: Public Docs Checks

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public-book/**'
      - 'scripts/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '.github/workflows/public-docs-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'

      - name: Check local Markdown links
        run: pnpm docs:links:check

      - name: Check license metadata freshness
        run: pnpm licenses:check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: '1.97.1'

      - name: Cache mdBook tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mdbook-tools
          key: mdbook-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/docs/build-mdbook.sh') }}

      - name: Select mdBook tools
        run: |
          echo "CARGO_INSTALL_ROOT=${{ runner.temp }}/mdbook-tools" >> "$GITHUB_ENV"
          echo "${{ runner.temp }}/mdbook-tools/bin" >> "$GITHUB_PATH"

      - name: Install mdBook
        run: cargo install --locked mdbook --version 0.5.4

      - name: Install mdBook Mermaid
        run: cargo install --locked mdbook-mermaid --version 0.17.1

      - name: Build public book
        run: ./scripts/docs/build-mdbook.sh public-book

      - name: Create README.html aliases
        run: ./scripts/docs/create-mdbook-readme-aliases.sh

      - name: Harden generated HTML
        run: ./scripts/docs/harden-mdbook-output.sh

      - name: Check generated security tags
        run: ./scripts/docs/check-mdbook-security-tags.sh
