name: Public Core Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  SESSION_CAPABILITY_SECRET: public-ci-session-capability-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-system:verify

      - name: Compare reviewed public API contract
        env:
          CI: 'true'
        run: pnpm api-contract:baseline:compare

      - name: Check generated OpenAPI reference
        run: pnpm api-contract:openapi:check

      - name: Check reviewed Gateway contract
        run: pnpm api-contract:gateway:check

      - name: Check catalog and TechDocs inputs
        run: pnpm catalog:check

      - name: Public Vitest subset
        env:
          CI: 'true'
        run: pnpm test:public

      - name: Build Vite static frontend
        run: pnpm build:ci

      - name: Build Storybook component previews
        run: pnpm storybook:build
