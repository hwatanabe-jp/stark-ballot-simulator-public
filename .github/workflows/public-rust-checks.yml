name: Public Rust Checks

on:
  push:
    branches: [main]
    paths: &rust_paths
      - 'verifier-service/**'
      - 'zkvm/contract-core/**'
      - 'zkvm/methods/guest/**'
      - 'infra/terraform/bootstrap/app-pipeline-scripts/current-zkvm-semantic-interface.generated.mjs'
      - 'packages/crypto-primitives/src/vote-commitment-domain.generated.ts'
      - 'docs/formal/generated-vectors/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/public-rust-checks.yml'
  pull_request:
    branches: [main]
    paths: *rust_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.99.0'

jobs:
  verifier-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-09
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-targets
          workspaces: |
            verifier-service -> target

      - name: Format check
        run: cargo fmt --all --manifest-path verifier-service/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path verifier-service/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path verifier-service/Cargo.toml

  contract-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-09
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-targets
          workspaces: |
            zkvm -> target

      - name: Format check
        run: cargo fmt --all --manifest-path zkvm/contract-core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path zkvm/contract-core/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path zkvm/contract-core/Cargo.toml

      - name: Run guest model vector tests
        run: cargo test --manifest-path zkvm/Cargo.toml -p guest test_formal_guest_model_vectors
