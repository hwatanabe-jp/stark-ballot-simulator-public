name: Public UI Mock E2E

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'scripts/start-test-server.sh'
      - 'scripts/clean-mock-sessions.sh'
      - 'scripts/tests/.env.test.defaults'
      - 'scripts/dev/**'
      - 'scripts/frontend/**'
      - 'scripts/package.json'
      - 'scripts/tsconfig.json'
      - 'tooling/workspace/workspace-metadata.ts'
      - 'tooling/tsconfig/**'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/workflows/public-ui-mock-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  SESSION_CAPABILITY_SECRET: public-ci-session-capability-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef

jobs:
  playwright-mock:
    name: Playwright Mock E2E and Axe
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Playwright mock and axe suites
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
