version: 0.2

# AWS CodeBuild buildspec for ARM64 Fargate prover Docker image
# This file builds a prover image candidate. It is not release authority by itself.
#
# Build Strategy:
# - Uses a pre-built RISC Zero toolchain base image when one is supplied
# - Base image contains: host Rust 1.97.1, guest Rust r0.1.97.0, pinned RISC Zero 3.0.6, build dependencies
# - Build time: 5-10 minutes (vs 70-90 minutes without base image)
# - See: docs/infrastructure/risc0-base-image.md

env:
  variables:
    AWS_DEFAULT_REGION: ap-northeast-1
  # AWS_ACCOUNT_ID is injected via CodeBuild environment variables

phases:
  pre_build:
    commands:
      - echo "Validating the exact requested source revision..."
      - |
        (
          set -euo pipefail
          if ! printf '%s' "${REQUESTED_SOURCE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "REQUESTED_SOURCE_SHA must be a full 40-character lowercase Git SHA." >&2
            exit 1
          fi
          if ! printf '%s' "${PIPELINE_SOURCE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "PIPELINE_SOURCE_SHA must be a full 40-character lowercase Git SHA." >&2
            exit 1
          fi
          if ! printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "CODEBUILD_RESOLVED_SOURCE_VERSION must be a full 40-character lowercase Git SHA." >&2
            exit 1
          fi
          if [ "$REQUESTED_SOURCE_SHA" != "$PIPELINE_SOURCE_SHA" ]; then
            echo "REQUESTED_SOURCE_SHA must match PIPELINE_SOURCE_SHA for prover release builds." >&2
            exit 1
          fi
          if [ "$REQUESTED_SOURCE_SHA" != "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then
            echo "REQUESTED_SOURCE_SHA must match CODEBUILD_RESOLVED_SOURCE_VERSION for prover release builds." >&2
            exit 1
          fi
          printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" > /tmp/source-sha
        )
      - echo "Computing the source zkVM interface hash..."
      - |
        node scripts/aws/compute-zkvm-interface-hash.mjs > /tmp/zkvm-contract-hash
        if ! grep -Eq '^[0-9a-f]{64}$' /tmp/zkvm-contract-hash; then
          echo "Invalid source zkVM interface hash." >&2
          exit 1
        fi
      - echo "Loading the exact Foundation image-signing authority..."
      - |
        FOUNDATION_AUTHORITY_FILE="$CODEBUILD_SRC_DIR_FoundationSigningAuthorityOutput/foundation-signing-authority.json"
        test -f "$FOUNDATION_AUTHORITY_FILE"
        node infra/terraform/bootstrap/foundation-pipeline-scripts/validate-foundation-image-signing-authority.mjs \
          --input "$FOUNDATION_AUTHORITY_FILE" \
          --expected-account-id "$AWS_ACCOUNT_ID" \
          --region "$AWS_DEFAULT_REGION" \
          --source-sha "$REQUESTED_SOURCE_SHA" \
          --image-kind prover \
          --repository-output /tmp/foundation-prover-repository \
          --signing-profile-output /tmp/foundation-signing-profile
      - export IMAGE_REPO_NAME="$(cat /tmp/foundation-prover-repository)"
      - export IMAGE_SIGNING_PROFILE_ARN="$(cat /tmp/foundation-signing-profile)"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo "Resolving RISC Zero toolchain base image..."
      - |
        TOOLCHAIN_AUTHORITY_FILE="$CODEBUILD_SRC_DIR_ToolchainAuthorityOutput/toolchain-authority.json"
        if [ ! -f "$TOOLCHAIN_AUTHORITY_FILE" ]; then
          echo "Resolved toolchain authority file is required for this prover release build." >&2
          exit 1
        fi
        echo "Using resolved toolchain authority from $TOOLCHAIN_AUTHORITY_FILE"
        RISC0_TOOLCHAIN_IMAGE="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(data["selectedToolchain"]["imageUri"])' "$TOOLCHAIN_AUTHORITY_FILE")"
        SELECTED_TOOLCHAIN_ARTIFACT_RECORD_KEY="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(data["selectedToolchain"]["artifactRecordKey"])' "$TOOLCHAIN_AUTHORITY_FILE")"
        SELECTED_TOOLCHAIN_ARTIFACT_RECORD_VERSION_ID="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(data["selectedToolchain"]["artifactRecordVersionId"])' "$TOOLCHAIN_AUTHORITY_FILE")"
        SELECTED_TOOLCHAIN_ARTIFACT_RECORD_SHA256="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(data["selectedToolchain"]["artifactRecordSha256"])' "$TOOLCHAIN_AUTHORITY_FILE")"
        if ! printf '%s' "$RISC0_TOOLCHAIN_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
          echo "RISC0_TOOLCHAIN_IMAGE must be digest-pinned with @sha256:<64 lowercase hex chars>." >&2
          exit 1
        fi
        export RISC0_TOOLCHAIN_IMAGE SELECTED_TOOLCHAIN_ARTIFACT_RECORD_KEY SELECTED_TOOLCHAIN_ARTIFACT_RECORD_VERSION_ID SELECTED_TOOLCHAIN_ARTIFACT_RECORD_SHA256
        printf '%s' "$RISC0_TOOLCHAIN_IMAGE" > /tmp/risc0-toolchain-image

      - echo "Determining image tags..."
      - |
        if [ -z "${IMAGE_REPO_NAME:-}" ]; then
          echo "IMAGE_REPO_NAME is required; the CodeBuild lane must supply the target prover repository name." >&2
          exit 1
        fi
        echo "Using IMAGE_REPO_NAME from environment: $IMAGE_REPO_NAME"
      # Image Tag Strategy:
      # - Prover release CodePipeline passes IMAGE_TAG=candidate-<pipeline-execution-id>
      # - Explicit primitive builds may override IMAGE_TAG
      # - Automatic fallback uses commit SHA only when IMAGE_TAG is not set
      # - Latest tag: Only updated for main branch builds
      # - See: docs/infrastructure/terraform.md (運用フロー)
      - |
        if [ -n "$IMAGE_TAG" ]; then
          echo "Using provided IMAGE_TAG: $IMAGE_TAG"
        else
          IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
          echo "No IMAGE_TAG provided, using commit SHA: $IMAGE_TAG"
        fi
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Image URI will be $IMAGE_URI"

      - |
        if [ "$CODEBUILD_WEBHOOK_TRIGGER" = "branch/main" ] || [ "$CODEBUILD_SOURCE_VERSION" = "refs/heads/main" ]; then
          LATEST_TAG=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:latest
          if [ "${PUSH_LATEST:-0}" = "1" ]; then
            echo "Main branch detected and PUSH_LATEST=1 - will also tag as latest"
          else
            echo "Main branch detected but PUSH_LATEST!=1 - skipping latest tag"
            unset LATEST_TAG
          fi
        fi

  build:
    commands:
      - echo "Building ARM64 Docker image..."
      - echo "Build started on $(date)"
      - RISC0_TOOLCHAIN_IMAGE="$(cat /tmp/risc0-toolchain-image)"
      - docker build --build-arg RISC0_TOOLCHAIN_IMAGE="$RISC0_TOOLCHAIN_IMAGE" -t $IMAGE_URI -f infra/docker/Dockerfile.fargate-prover .

      - echo "Smoke-testing the non-root, read-only prover container posture..."
      - |
        FAILURE_MARKER_CONTRACT_SHA256="$(sha256sum infra/docker/prover-failure-marker-contract.json | awk '{print $1}')"
        if ! printf '%s' "$FAILURE_MARKER_CONTRACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
          echo "Unable to compute the prover failure-marker contract SHA-256." >&2
          exit 1
        fi
        printf '%s' "$FAILURE_MARKER_CONTRACT_SHA256" > /tmp/prover-failure-marker-contract-sha256
      - scripts/tests/fargate-prover-container-smoke.sh "$IMAGE_URI"
      - printf 'PASS' > /tmp/prover-failure-marker-smoke-status

      - |
        if [ -n "$LATEST_TAG" ]; then
          echo "Tagging image as latest..."
          docker tag $IMAGE_URI $LATEST_TAG
        fi

      - echo "Extracting ARM64 guest ImageID from built prover image..."
      - |
        IMAGE_ID_METADATA="$(docker run --rm --entrypoint /opt/zkvm/bin/host "$IMAGE_URI" --print-image-id --json)"
        printf '%s' "$IMAGE_ID_METADATA" > /tmp/risc0-image-id.json
        ARM64_RISC0_IMAGE_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["imageId"])' < /tmp/risc0-image-id.json)"
        METHOD_VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["methodVersion"])' < /tmp/risc0-image-id.json)"
        if ! printf '%s' "$ARM64_RISC0_IMAGE_ID" | grep -Eq '^0x[0-9a-f]{64}$'; then
          echo "Invalid ARM64 RISC Zero ImageID emitted by prover image: $ARM64_RISC0_IMAGE_ID" >&2
          exit 1
        fi
        if ! printf '%s' "$METHOD_VERSION" | grep -Eq '^[0-9]+$'; then
          echo "Invalid methodVersion emitted by prover image: $METHOD_VERSION" >&2
          exit 1
        fi
        printf '%s' "$ARM64_RISC0_IMAGE_ID" > /tmp/arm64-risc0-image-id
        printf '%s' "$METHOD_VERSION" > /tmp/method-version

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $IMAGE_URI

      - |
        if [ -n "$LATEST_TAG" ]; then
          echo "Pushing latest tag..."
          docker push $LATEST_TAG
        fi

      - echo "Build completed on $(date)"
      - echo "Waiting for ECR to register image scan (10s delay)..."
      - sleep 10
      - echo "Waiting for ECR image scan to complete..."
      - aws ecr wait image-scan-complete --repository-name "$IMAGE_REPO_NAME" --image-id imageTag="$IMAGE_TAG"
      - |
        CRITICAL_HIGH_COUNT=$(aws ecr describe-image-scan-findings \
          --repository-name "$IMAGE_REPO_NAME" \
          --image-id imageTag="$IMAGE_TAG" \
          --query 'length(imageScanFindings.findings[?severity==`CRITICAL` || severity==`HIGH`])' \
          --output text)
        if ! printf '%s' "$CRITICAL_HIGH_COUNT" | grep -Eq '^[0-9]+$'; then
          echo "Unable to parse HIGH/CRITICAL ECR scan finding count: $CRITICAL_HIGH_COUNT" >&2
          exit 1
        fi
        if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
          echo "ECR scan found $CRITICAL_HIGH_COUNT HIGH/CRITICAL findings. Failing build."
          exit 1
        fi
        echo "ECR scan passed with no HIGH/CRITICAL findings."
      - echo "Writing image metadata..."
      - |
        RISC0_TOOLCHAIN_IMAGE="$(cat /tmp/risc0-toolchain-image)"
        ARM64_RISC0_IMAGE_ID="$(cat /tmp/arm64-risc0-image-id)"
        METHOD_VERSION="$(cat /tmp/method-version)"
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$IMAGE_REPO_NAME" \
          --image-ids imageTag="$IMAGE_TAG" \
          --query 'imageDetails[0].imageDigest' \
          --output text)
        DIGEST_PINNED_IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME@$IMAGE_DIGEST"
        printf '%s' "$IMAGE_DIGEST" > /tmp/prover-image-digest
        printf '%s' "$DIGEST_PINNED_IMAGE_URI" > /tmp/digest-pinned-image-uri
      - echo "Re-reading ImageID from pushed digest-pinned prover image..."
      - |
        DIGEST_PINNED_IMAGE_URI="$(cat /tmp/digest-pinned-image-uri)"
        ARM64_RISC0_IMAGE_ID="$(cat /tmp/arm64-risc0-image-id)"
        METHOD_VERSION="$(cat /tmp/method-version)"
        docker pull "$DIGEST_PINNED_IMAGE_URI"
        POST_PUSH_IMAGE_ID_METADATA="$(docker run --rm --entrypoint /opt/zkvm/bin/host "$DIGEST_PINNED_IMAGE_URI" --print-image-id --json)"
        printf '%s' "$POST_PUSH_IMAGE_ID_METADATA" > /tmp/risc0-image-id-post-push.json
        POST_PUSH_RISC0_IMAGE_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["imageId"])' < /tmp/risc0-image-id-post-push.json)"
        POST_PUSH_METHOD_VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["methodVersion"])' < /tmp/risc0-image-id-post-push.json)"
        if [ "$POST_PUSH_RISC0_IMAGE_ID" != "$ARM64_RISC0_IMAGE_ID" ]; then
          echo "Post-push ImageID does not match built image ImageID." >&2
          exit 1
        fi
        if [ "$POST_PUSH_METHOD_VERSION" != "$METHOD_VERSION" ]; then
          echo "Post-push methodVersion does not match built image methodVersion." >&2
          exit 1
        fi
        printf '%s' "$POST_PUSH_RISC0_IMAGE_ID" > /tmp/post-push-risc0-image-id
        printf '%s' "$POST_PUSH_METHOD_VERSION" > /tmp/post-push-method-version
      - echo "Waiting for ECR managed signing status..."
      - |
        IMAGE_DIGEST="$(cat /tmp/prover-image-digest)"
        SIGNING_STATUS=""
        SIGNING_STATUS_JSON="/tmp/prover-signing-status.json"
        test -n "${IMAGE_SIGNING_PROFILE_ARN:-}"
        for attempt in $(seq 1 30); do
          aws ecr describe-image-signing-status \
            --repository-name "$IMAGE_REPO_NAME" \
            --image-id imageDigest="$IMAGE_DIGEST" \
            --region "$AWS_DEFAULT_REGION" \
            --output json > "$SIGNING_STATUS_JSON"
          SIGNING_DECISION_JSON="$(node infra/terraform/bootstrap/foundation-pipeline-scripts/inspect-managed-signing-readiness.mjs --input "$SIGNING_STATUS_JSON" --expected-profile "$IMAGE_SIGNING_PROFILE_ARN")"
          SIGNING_DECISION="$(printf '%s' "$SIGNING_DECISION_JSON" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { const parsed=JSON.parse(value); process.stdout.write(String(parsed.decision || "")); });')"
          SIGNING_REASON="$(printf '%s' "$SIGNING_DECISION_JSON" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { const parsed=JSON.parse(value); process.stdout.write(String(parsed.reasonCode || "")); });')"
          case "$SIGNING_DECISION" in
            READY)
              SIGNING_STATUS="COMPLETE"
              break
              ;;
            RETRY)
              if [ "$attempt" -eq 30 ]; then
                echo "ECR managed signing readiness budget exhausted: ${SIGNING_REASON:-VERIFIER_ERROR}." >&2
                exit 1
              fi
              echo "ECR managed signing is not ready (attempt $attempt/30): ${SIGNING_REASON:-VERIFIER_ERROR}."
              sleep 20
              ;;
            REJECT)
              echo "ECR managed signing readiness rejected: ${SIGNING_REASON:-VERIFIER_ERROR}." >&2
              exit 1
              ;;
            *)
              echo "ECR managed signing readiness returned an invalid decision." >&2
              exit 1
              ;;
          esac
        done
        if [ "$SIGNING_STATUS" != "COMPLETE" ]; then
          echo "ECR signing status must be COMPLETE for prover candidate readiness." >&2
          exit 1
        fi
      - |
        set -euo pipefail
        IMAGE_DIGEST="$(cat /tmp/prover-image-digest)"
        DIGEST_PINNED_IMAGE_URI="$(cat /tmp/digest-pinned-image-uri)"
        RISC0_TOOLCHAIN_IMAGE="$(cat /tmp/risc0-toolchain-image)"
        ARM64_RISC0_IMAGE_ID="$(cat /tmp/arm64-risc0-image-id)"
        METHOD_VERSION="$(cat /tmp/method-version)"
        POST_PUSH_RISC0_IMAGE_ID="$(cat /tmp/post-push-risc0-image-id)"
        POST_PUSH_METHOD_VERSION="$(cat /tmp/post-push-method-version)"
        SOURCE_SHA="$(cat /tmp/source-sha)"
        ZKVM_CONTRACT_HASH="$(cat /tmp/zkvm-contract-hash)"
        FAILURE_MARKER_CONTRACT_SHA256="$(cat /tmp/prover-failure-marker-contract-sha256)"
        FAILURE_MARKER_SMOKE_STATUS="$(cat /tmp/prover-failure-marker-smoke-status)"
        RELEASE_PIPELINE_EXECUTION_ID="${RELEASE_PIPELINE_EXECUTION_ID:?RELEASE_PIPELINE_EXECUTION_ID is required}"
        if ! printf '%s' "$RELEASE_PIPELINE_EXECUTION_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
          echo "RELEASE_PIPELINE_EXECUTION_ID must be a lowercase UUID." >&2
          exit 1
        fi
        CANDIDATE_EXECUTION_ID="prover-candidate/$RELEASE_PIPELINE_EXECUTION_ID"
        printf '{"imageUri":"%s","digest":"%s","failureMarkerContractSha256":"%s","failureMarkerSmokeStatus":"%s","sourceSha":"%s","zkvmContractHash":"%s","methodVersion":%s,"postPushMethodVersion":%s,"risc0ImageId":"%s","postPushRisc0ImageId":"%s","risc0ToolchainImage":"%s","selectedToolchainArtifactRecordKey":"%s","selectedToolchainArtifactRecordVersionId":"%s","selectedToolchainArtifactRecordSha256":"%s","scanStatus":"PASS","buildId":"%s"}' \
          "$DIGEST_PINNED_IMAGE_URI" "$IMAGE_DIGEST" "$FAILURE_MARKER_CONTRACT_SHA256" "$FAILURE_MARKER_SMOKE_STATUS" "$SOURCE_SHA" "$ZKVM_CONTRACT_HASH" "$METHOD_VERSION" "$POST_PUSH_METHOD_VERSION" "$ARM64_RISC0_IMAGE_ID" "$POST_PUSH_RISC0_IMAGE_ID" "$RISC0_TOOLCHAIN_IMAGE" "${SELECTED_TOOLCHAIN_ARTIFACT_RECORD_KEY:-}" "${SELECTED_TOOLCHAIN_ARTIFACT_RECORD_VERSION_ID:-}" "${SELECTED_TOOLCHAIN_ARTIFACT_RECORD_SHA256:-}" "$CANDIDATE_EXECUTION_ID" \
          > image-metadata.json
      - cat image-metadata.json

artifacts:
  files:
    - image-metadata.json
  name: fargate-prover-image-$(date +%Y%m%d-%H%M%S)

cache:
  paths:
    - '/root/.cargo/**/*'
    - 'zkvm/target/**/*'
